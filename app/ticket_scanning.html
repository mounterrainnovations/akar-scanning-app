<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trippechalo - Ticket Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b8cee",
                        "primary-content": "#ffffff",
                        "primary-light": "#e0f0ff",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "success": "#22c55e",
                        "error": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"],
                        "sans": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col overflow-hidden">
<!-- Header -->
<header class="flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20">
<button class="flex items-center justify-center w-10 h-10 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-lg font-bold text-slate-900 dark:text-white">Scan Ticket</h1>
<button class="flex items-center justify-center w-10 h-10 rounded-full text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl">help</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col relative overflow-y-auto">
<!-- Viewfinder Section -->
<div class="relative w-full aspect-[3/4] bg-slate-900 overflow-hidden group">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 bg-cover bg-center opacity-60 mix-blend-overlay" data-alt="Blurred crowd at a concert event" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAd3Sh3XCLut7C_Y7RyCxUaH5df8zv0Qb2rnCJ3Ib0EkxpQu1IkKB-osg6i7Igz-qXVaRIKg4eRohCwDhsSz_IekrWuR87VJBgtZ2RVVjhhYPda_ao3SAEdAmK6lLvc_uShiYFelO4FnM9xlzEK_fnGWCYTQuxP8kNfQB66pbwXzuxXPTnyj9zLyLr7xAaNMkm3nqSQqw7iIpKHmtee3G_unQuQYTgitWjEllQrroU7zcxN80Rb-N7mE0nX_SGEWBlfG7FnR17qWMI');"></div>
<!-- Scanning Overlay Frame -->
<div class="absolute inset-0 flex flex-col items-center justify-center p-8">
<div class="relative w-64 h-64 border-2 border-white/50 rounded-3xl overflow-hidden backdrop-blur-[2px]">
<!-- Corner Markers -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
<!-- Scanning Line Animation -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary/80 shadow-[0_0_15px_rgba(43,140,238,0.8)] animate-[scan_2s_ease-in-out_infinite]"></div>
</div>
<p class="mt-6 text-white text-sm font-medium bg-black/40 px-4 py-2 rounded-full backdrop-blur-md">
                    Align QR code within frame
                </p>
</div>
<!-- Camera Controls Overlay -->
<div class="absolute bottom-6 left-0 right-0 flex justify-center items-center gap-8">
<button class="flex flex-col items-center gap-1 text-white/80 hover:text-white transition-colors group/btn">
<div class="w-12 h-12 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center group-hover/btn:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">flash_on</span>
</div>
<span class="text-xs font-medium">Flash</span>
</button>
<button class="w-16 h-16 rounded-full border-4 border-white flex items-center justify-center bg-white/10 backdrop-blur-sm active:scale-95 transition-transform">
<div class="w-12 h-12 rounded-full bg-white"></div>
</button>
<button class="flex flex-col items-center gap-1 text-white/80 hover:text-white transition-colors group/btn">
<div class="w-12 h-12 rounded-full bg-black/30 backdrop-blur-md flex items-center justify-center group-hover/btn:bg-primary/20 transition-colors">
<span class="material-symbols-outlined">cameraswitch</span>
</div>
<span class="text-xs font-medium">Flip</span>
</button>
</div>
</div>
<!-- Manual Entry & Recent Scan -->
<div class="flex-1 bg-background-light dark:bg-background-dark p-4 flex flex-col gap-4 -mt-4 rounded-t-3xl z-10 relative shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
<div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-2"></div>
<button class="w-full py-3.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-primary font-semibold flex items-center justify-center gap-2 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-750 transition-colors">
<span class="material-symbols-outlined text-[20px]">keyboard</span>
                Enter code manually
            </button>
<!-- Success Scan Result Card -->
<div class="mt-2 bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-4 animate-[slideUp_0.3s_ease-out]">
<div class="relative w-14 h-14 rounded-full overflow-hidden flex-shrink-0 border-2 border-success">
<img alt="Attendee Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRav36NlpTeFytBxj9tys2Kp3CtotHT4c72UMmP2lB4qVQlKOTsGcf9KE15JuXytmMpwgRXTSQXObu7AcFDUmZGJzVhsR9ERG1BPc8jOkKgWo91aRSH4TlnkhtmhZyxDGxz0x8K4-Qmpnvs9NMKwfktfPSLY8DZqHmH80Rw-yglKiPqg-vMzpjwN4ZTBSi9igo53clPDltf89_oYsK3y5bSCTReZ3_B_3TvuaPBBrxSDXUdCcXg6N6UxcWqNpFu0NM5SZEq13Z434"/>
<div class="absolute inset-0 bg-success/20"></div>
<div class="absolute bottom-0 right-0 bg-success text-white text-[10px] p-0.5 rounded-tl-md">
<span class="material-symbols-outlined text-[14px] font-bold">check</span>
</div>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<span class="px-2 py-0.5 bg-success/10 text-success text-[10px] font-bold uppercase tracking-wider rounded-md">Valid</span>
<span class="text-xs text-slate-400">Just now</span>
</div>
<h3 class="text-slate-900 dark:text-white font-bold text-base truncate">Johnathan Doe</h3>
<p class="text-slate-500 dark:text-slate-400 text-xs truncate">VIP All Access Pass • #TKT-8293</p>
</div>
<button class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
<!-- Previous Scan (Invalid Example - slightly faded) -->
<div class="opacity-60 bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-4 scale-95 origin-top">
<div class="relative w-14 h-14 rounded-full overflow-hidden flex-shrink-0 border-2 border-error">
<div class="w-full h-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-400">
<span class="material-symbols-outlined text-2xl">person</span>
</div>
<div class="absolute inset-0 bg-error/10"></div>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-2 mb-0.5">
<span class="px-2 py-0.5 bg-error/10 text-error text-[10px] font-bold uppercase tracking-wider rounded-md">Invalid</span>
<span class="text-xs text-slate-400">2m ago</span>
</div>
<h3 class="text-slate-900 dark:text-white font-bold text-base truncate">Ticket Expired</h3>
<p class="text-slate-500 dark:text-slate-400 text-xs truncate">Standard Entry • #TKT-0021</p>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 pb-safe pt-2">
<div class="flex justify-around items-center h-16">
<a class="flex flex-col items-center justify-center gap-1 w-full text-primary" href="#">
<span class="material-symbols-outlined text-[26px] font-variation-settings-fill">qr_code_scanner</span>
<span class="text-[11px] font-medium">Scan</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 w-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">groups</span>
<span class="text-[11px] font-medium">Attendees</span>
</a>
<a class="flex flex-col items-center justify-center gap-1 w-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">settings</span>
<span class="text-[11px] font-medium">Settings</span>
</a>
</div>
<!-- Safe area spacer for mobile -->
<div class="h-4 w-full bg-white dark:bg-slate-900"></div>
</nav>
<style>
        .font-variation-settings-fill {
            font-variation-settings: 'FILL' 1;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
