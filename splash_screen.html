<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trippechalo Splash Screen</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2b8cee",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<!-- Splash Screen Container -->
<div class="relative flex min-h-screen w-full flex-col justify-between overflow-hidden bg-background-light dark:bg-background-dark p-6">
<!-- Top Spacer for balance -->
<div class="flex-1"></div>
<!-- Central Logo Area -->
<div class="flex flex-col items-center justify-center gap-8 flex-1">
<!-- Logo Icon Container -->
<div class="relative flex items-center justify-center">
<!-- Outer glow effect -->
<div class="absolute inset-0 rounded-full bg-primary/20 blur-3xl w-48 h-48 animate-pulse"></div>
<!-- Icon Circle -->
<div class="relative z-10 flex h-32 w-32 items-center justify-center rounded-[2.5rem] bg-gradient-to-br from-primary to-blue-600 shadow-xl shadow-primary/30">
<span class="material-symbols-outlined text-white text-[4rem]">qr_code_scanner</span>
</div>
</div>
</div>
<!-- Bottom Branding -->
<div class="flex flex-col items-center justify-end pb-12 flex-1">
<h1 class="text-slate-900 dark:text-slate-100 text-4xl font-bold tracking-tight mb-2">Trippechalo</h1>
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium tracking-wide uppercase">Event Staff Access</p>
<!-- Loading Indicator (Subtle) -->
<div class="mt-8 flex gap-2">
<div class="h-2 w-2 rounded-full bg-primary animate-bounce" style="animation-delay: 0s"></div>
<div class="h-2 w-2 rounded-full bg-primary/60 animate-bounce" style="animation-delay: 0.1s"></div>
<div class="h-2 w-2 rounded-full bg-primary/30 animate-bounce" style="animation-delay: 0.2s"></div>
</div>
</div>
</div>
</body></html>
